[project]
name = "pylibs-calc-whatif"
version = "0.1.0"
description = "What-if analysis plugin for pylibs-calc: overrides, shocks, formula columns and saved, hash-chained scenarios."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sanjay Sharma", email = "sanjaysharmagwl@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "pylibs-calc>=0.2,<0.3",
    "polars>=1.44,<2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
fastapi = ["pylibs-calc[fastapi]>=0.2,<0.3"]
redis = ["redis>=5"]

[project.entry-points."pylibs_calc.plugins"]
whatif = "pylibs_calc_whatif:WhatIfPlugin"

[project.urls]
Repository = "https://github.com/sanjaysharmagwl/py-libs"

# Resolve pylibs-calc from this workspace during development; the published
# wheel keeps the normal `pylibs-calc>=0.2,<0.3` requirement.
[tool.uv.sources]
pylibs-calc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylibs_calc_whatif"]
