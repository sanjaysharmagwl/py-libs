[project]
name = "pylibs-core"
version = "0.1.0"
description = "Core utilities shared across py-libs packages."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sanjay Sharma", email = "sanjaysharmagwl@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/sanjaysharmagwl/py-libs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylibs_core"]
