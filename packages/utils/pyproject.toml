[project]
name = "pylibs-utils"
version = "0.1.0"
description = "Higher-level helpers built on pylibs-core."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sanjay Sharma", email = "sanjaysharmagwl@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["pylibs-core>=0.1.0"]

[project.urls]
Repository = "https://github.com/sanjaysharmagwl/py-libs"

# Resolve pylibs-core from this workspace during development; the published
# wheel keeps the normal `pylibs-core>=0.1.0` requirement.
[tool.uv.sources]
pylibs-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylibs_utils"]
