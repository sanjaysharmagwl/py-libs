# Virtual workspace root: not a package itself, only shared config and dev tooling.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26",
    "httpx2>=2.13",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.9",
]
docs = [
    "markdown-exec>=1.12.3",
    "mkdocs>=1.6,<2",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated graph output; also excluded in .pre-commit-config.yaml.
extend-exclude = ["graphify-out"]

[tool.ruff.format]
# Code blocks in the docs hold snippet markers (--8<--) and hand-wrapped examples; leave them be.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pylibs_*"]
# scripts/ run on Python 3.12, so treat tomllib as stdlib despite the py310 target.
extra-standard-library = ["tomllib"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages", "docs/examples"]
